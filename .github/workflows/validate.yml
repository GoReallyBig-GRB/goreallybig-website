# Durable validation: focus on genuine integrity, security, and syntax regressions.
name: Validate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site and changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inventory changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-status "${BASE_SHA}...${HEAD_SHA}" > /tmp/changed-files.txt
          cat /tmp/changed-files.txt
          echo "count=$(wc -l < /tmp/changed-files.txt)" >> "$GITHUB_OUTPUT"

      - name: Verify required repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          echo "Required repository structure is present."

      - name: Check basic HTML structure
        shell: bash
        run: |
          set -euo pipefail
          grep -qi '<!doctype html' index.html
          grep -qi '<html' index.html
          grep -qi '<head' index.html
          grep -qi '<body' index.html
          echo "Basic HTML structure checks passed."

      - name: Scan for dangerous JavaScript constructs
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --include='*.html' --include='*.js' --include='*.mjs' '(^|[^[:alnum:]_])(eval[[:space:]]*\(|new[[:space:]]+Function[[:space:]]*\(|document\.write[[:space:]]*\()' .; then
            echo "ERROR: Dangerous JavaScript construct detected."
            exit 1
          fi
          echo "Dangerous JavaScript construct scan passed."

      - name: Reject executable external scripts
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --include='*.html' "<script[^>]+src=[\"']https?://" .; then
            echo "ERROR: External executable JavaScript detected."
            exit 1
          fi
          echo "External executable script check passed."

      - name: Check local asset references
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('.').resolve()
          files = [p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and 'node_modules' not in p.parts and p.suffix.lower() in {'.html', '.css'}]
          html_pattern = re.compile(r'''(?:src|href)\s*=\s*["']([^"']+)["']''', re.IGNORECASE)
          css_pattern = re.compile(r'''url\(\s*["']?([^\)"']+)["']?\s*\)''', re.IGNORECASE)
          ignored = ('#', 'data:', 'mailto:', 'tel:', 'javascript:', 'http://', 'https://', '//')
          failures = []

          for file in files:
              try:
                  text = file.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              pattern = html_pattern if file.suffix.lower() == '.html' else css_pattern
              for match in pattern.finditer(text):
                  reference = match.group(1).strip()
                  if reference.startswith(ignored):
                      continue
                  reference = reference.split('#', 1)[0].split('?', 1)[0]
                  if not reference:
                      continue
                  target = root / reference.lstrip('/') if reference.startswith('/') else file.parent / reference
                  if not target.exists():
                      failures.append(f'{file.relative_to(root)} -> {reference}')

          if failures:
              print('ERROR: Broken local asset references detected:')
              for failure in failures:
                  print(f'  {failure}')
              sys.exit(1)
          print('Local asset reference check passed.')
          PY

      - name: Secret scan
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown

      - name: Validate changed HTML with html-validate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | grep -Ei '\.html$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed HTML files to validate."
            exit 0
          fi
          cat > /tmp/htmlvalidate.json <<'JSON'
          {
            "extends": [],
            "rules": {
              "close-order": "error",
              "no-dup-attr": "error",
              "no-conditional-comment": "error",
              "missing-doctype": "error"
            }
          }
          JSON
          printf 'Validating changed HTML files:\n'
          printf '  %s\n' "${files[@]}"
          npx --yes html-validate@11 --config /tmp/htmlvalidate.json "${files[@]}"

      - name: Validate changed CSS with Stylelint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | grep -Ei '\.css$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed CSS files to validate."
            exit 0
          fi
          cat > /tmp/stylelint.config.mjs <<'JS'
          export default { rules: {} };
          JS
          npx --yes stylelint@17 --config /tmp/stylelint.config.mjs "${files[@]}"

      - name: Validate changed SVG syntax
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | grep -Ei '\.svg$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed SVG files to validate."
            exit 0
          fi
          python3 - "${files[@]}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          failures = []
          for filename in sys.argv[1:]:
              try:
                  ET.parse(filename)
              except ET.ParseError as exc:
                  failures.append(f'{filename}: {exc}')
          if failures:
              print('ERROR: Invalid SVG/XML syntax detected:')
              for failure in failures:
                  print(f'  {failure}')
              sys.exit(1)
          print('Changed SVG syntax checks passed.')
          PY

      - name: Check Git whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}...${HEAD_SHA}"
          echo "Git whitespace check passed."

      - name: Write validation summary
        if: always()
        env:
          CHANGED_COUNT: ${{ steps.changes.outputs.count }}
        shell: bash
        run: |
          {
            echo "## GoReallyBig validation"
            echo
            echo "- Files changed: ${CHANGED_COUNT}"
            echo "- Repository structure: checked"
            echo "- HTML structure: checked"
            echo "- Dangerous JavaScript constructs: checked"
            echo "- External executable scripts: checked"
            echo "- Local asset references: checked"
            echo "- TruffleHog secret scan: checked"
            echo "- Changed HTML: validated with html-validate 11.x"
            echo "- Changed CSS: syntax-parsed with Stylelint 17.x"
            echo "- Changed SVG: XML syntax checked"
            echo "- Git whitespace errors: checked"
            echo
            echo "No artificial PR size limit."
            echo "Workflow changes are permitted through normal pull requests."
            echo "No controlled-edit mechanism is used."
          } >> "$GITHUB_STEP_SUMMARY"
