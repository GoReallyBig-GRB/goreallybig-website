name: Validate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site and changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inventory changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git diff --name-status "${BASE_SHA}...${HEAD_SHA}" > /tmp/changed-files.txt

          echo "Base: $BASE_SHA"
          echo "Head: $HEAD_SHA"
          echo
          echo "Changed files:"
          cat /tmp/changed-files.txt

          {
            echo "count=$(wc -l < /tmp/changed-files.txt)"
            echo "base_sha=${BASE_SHA}"
            echo "head_sha=${HEAD_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify required repository structure
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html

          echo "Required repository structure is present."

      - name: Check basic HTML structure
        shell: bash
        run: |
          set -euo pipefail

          grep -qi '<!doctype html' index.html
          grep -qi '<html' index.html
          grep -qi '<head' index.html
          grep -qi '<body' index.html

          echo "Basic HTML structure checks passed."

      - name: Scan for dangerous JavaScript constructs
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --include='*.html' \
            --include='*.js' \
            --include='*.mjs' \
            '(^|[^[:alnum:]_])(eval[[:space:]]*\(|new[[:space:]]+Function[[:space:]]*\(|document\.write[[:space:]]*\()' \
            .; then
            echo
            echo "ERROR: Dangerous JavaScript construct detected."
            exit 1
          fi

          echo "Dangerous JavaScript construct scan passed."

      - name: Reject executable external scripts
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --include='*.html' \
            '<script[^>]+src=["'\'']https?://' \
            .; then
            echo
            echo "ERROR: External executable JavaScript detected."
            echo "Use same-origin/local JavaScript assets instead."
            exit 1
          fi

          echo "External executable script check passed."

      - name: Check local asset references
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(".").resolve()

          files = [
              p for p in root.rglob("*")
              if p.is_file()
              and ".git" not in p.parts
              and "node_modules" not in p.parts
              and p.suffix.lower() in {".html", ".css"}
          ]

          html_pattern = re.compile(
              r'''(?:src|href)\s*=\s*["']([^"']+)["']''',
              re.IGNORECASE,
          )

          css_pattern = re.compile(
              r'''url\(\s*["']?([^\)"']+)["']?\s*\)''',
              re.IGNORECASE,
          )

          ignored_prefixes = (
              "#",
              "data:",
              "mailto:",
              "tel:",
              "javascript:",
              "http://",
              "https://",
              "//",
          )

          failures = []

          for file in files:
              try:
                  text = file.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              pattern = (
                  html_pattern
                  if file.suffix.lower() == ".html"
                  else css_pattern
              )

              for match in pattern.finditer(text):
                  reference = match.group(1).strip()

                  if reference.startswith(ignored_prefixes):
                      continue

                  reference = reference.split("#", 1)[0].split("?", 1)[0]

                  if not reference:
                      continue

                  if reference.startswith("/"):
                      target = root / reference.lstrip("/")
                  else:
                      target = file.parent / reference

                  if not target.exists():
                      failures.append(
                          f"{file.relative_to(root)} -> {reference}"
                      )

          if failures:
              print("ERROR: Broken local asset references detected:")

              for failure in failures:
                  print(f"  {failure}")

              sys.exit(1)

          print("Local asset reference check passed.")
          PY

      - name: Secret scan
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown

      - name: Install HTML validator
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --disable-pip-version-check html5validator

      - name: Validate changed HTML, CSS, and SVG
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" |
            grep -Ei '\.(html|css|svg)$' || true
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed HTML/CSS/SVG files to validate."
            exit 0
          fi

          printf 'Validating changed files:\n'
          printf '  %s\n' "${files[@]}"

          html5validator \
            --also-check-css \
            --also-check-svg \
            "${files[@]}"

      - name: Check Git whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git diff --check "${BASE_SHA}...${HEAD_SHA}"

          echo "Git whitespace check passed."

      - name: Write validation summary
        if: always()
        env:
          CHANGED_COUNT: ${{ steps.changes.outputs.count }}
        shell: bash
        run: |
          {
            echo "## GoReallyBig validation"
            echo
            echo "- Files changed: ${CHANGED_COUNT}"
            echo "- Required repository structure: checked"
            echo "- HTML structure: checked"
            echo "- Dangerous JavaScript constructs: checked"
            echo "- External executable scripts: checked"
            echo "- Local asset references: checked"
            echo "- TruffleHog OSS secret scan: checked"
            echo "- Changed HTML/CSS/SVG validation: checked"
            echo "- Git whitespace errors: checked"
            echo
            echo "No artificial PR size limit."
            echo "Workflow changes are permitted through normal pull requests."
            echo "No controlled-edit mechanism is used."
          } >> "$GITHUB_STEP_SUMMARY"
