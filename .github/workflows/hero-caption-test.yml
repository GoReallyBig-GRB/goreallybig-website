name: One-time hero caption test

on:
  push:
    branches:
      - test/hero-caption-title-case

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capitalize every word in hero caption
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          raw = path.read_text(encoding='utf-8')

          old = 'Start with a professional website that makes your business look credible, gets you found online, and turns visitors into customers. At <strong>GoReallyBig</strong>, our job is to make your website make money for you.'
          new = 'Start With A Professional Website That Makes Your Business Look Credible, Gets You Found Online, And Turns Visitors Into Customers. At <strong>GoReallyBig</strong>, Our Job Is To Make Your Website Make Money For You.'

          if raw.count(old) != 1:
              raise SystemExit(f'Expected exactly one hero caption match; found {raw.count(old)}')

          path.write_text(raw.replace(old, new), encoding='utf-8')
          PY

      - name: Remove one-time test workflow
        run: rm .github/workflows/hero-caption-test.yml

      - name: Commit hero caption change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GoReallyBig"
          git config user.email "goreallybig.business@gmail.com"
          git add index.html .github/workflows/hero-caption-test.yml
          git commit -m "test: capitalize hero caption"
          git push